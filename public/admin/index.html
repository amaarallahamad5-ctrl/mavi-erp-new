<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mavi ERP — الإدارة</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --navy:#121E48; --navy2:#0F2D64; --navy3:#1D3B7A; --gold:#B08D57; --gold-2:#D8C39A;
    --ink:#16202E; --muted:#6B7B8F; --line:#E2E8F0; --bg:#F4F6FA; --card:#fff;
    --ok:#137A4A; --ok-l:#E6F5EE; --warn:#A8620A; --warn-l:#FDF1DF; --bad:#B02A2A; --bad-l:#FDEAEA;
    --r:14px;
  }
  body{font-family:"Segoe UI",Tahoma,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);
    font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .app{display:flex;min-height:100vh}
  aside{width:232px;flex:0 0 232px;background:linear-gradient(180deg,var(--navy2),#0A1A3D);color:#dfe9f7;
    padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
  .logo{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .logo .em{width:42px;height:42px;border-radius:50%;box-shadow:0 0 0 2px #d8c39a99;flex:0 0 42px;
    background:#fff url('/brand/emblem_small.png') center/cover}
  .logo b{font-size:16px;color:#fff;letter-spacing:2px;display:block;line-height:1.2}
  .logo span{font-size:8.5px;color:var(--gold-2);letter-spacing:1.9px;text-transform:uppercase}
  .role{margin:10px 6px 0;font-size:10.5px;background:#ffffff14;border-radius:8px;padding:5px 9px;color:#c3d7ef}
  .role b{color:#fff}
  .navlabel{font-size:11px;color:#8fb0d8;margin:16px 8px 6px}
  nav a{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:10px;color:#d5e3f6;
    text-decoration:none;font-size:14px;margin-bottom:2px;cursor:pointer}
  nav a:hover{background:#ffffff18}
  nav a.admin-store-link{margin-top:10px;border:1px solid #ffffff26;color:#ead7b5}
  nav a.on{background:#fff;color:var(--navy2);font-weight:600}
  nav a .ic{width:18px;text-align:center}
  nav a .pill{margin-inline-start:auto;background:#ffffff26;color:#fff;font-size:11px;padding:1px 7px;border-radius:20px}
  nav a.on .pill{background:#dbe6f8;color:var(--navy2)}
  nav a.locked{opacity:.45}
  .sidenote{margin-top:18px;padding:10px;border-radius:10px;background:#ffffff10;font-size:10.5px;color:#b9cdea;line-height:1.7}
  main{flex:1;min-width:0;padding:20px 24px 60px}
  .topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .topbar h1{font-size:21px}
  .sub{font-size:12.5px;color:var(--muted)}
  .spacer{flex:1}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;border-radius:10px;
    font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;
    gap:6px;white-space:nowrap}
  .btn:hover{background:#fafcff;border-color:#c9d6e6}
  .btn.primary{background:var(--navy3);border-color:var(--navy3);color:#fff}
  .btn.primary:hover{background:var(--navy2)}
  .btn.wa{background:#e7f7ee;border-color:#bfe6cf;color:#0d6841}
  .btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--navy3)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
  .grid{display:grid;gap:13px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
  .kpi .lab{font-size:12.5px;color:var(--muted)}
  .kpi .val{font-size:24px;font-weight:800;margin-top:6px;direction:ltr;text-align:right;white-space:nowrap}
  .kpi .val small{font-size:12.5px;font-weight:600;color:var(--muted)}
  .kpi .foot{font-size:11.5px;color:var(--muted);margin-top:3px}
  .kpi.accent{background:linear-gradient(160deg,var(--navy3),var(--navy2));color:#fff;border-color:transparent}
  .kpi.accent .lab,.kpi.accent .foot{color:#b7d0ef}
  .kpi.gold{background:linear-gradient(160deg,#fff8ea,#fdf0d8);border-color:#f0dfbc}
  .kpi.gold .lab,.kpi.gold .foot{color:#8a6a22}
  h2.sec{font-size:15px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
  h2.sec .cnt{font-size:12px;color:var(--muted);font-weight:500}
  .tscroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:right;font-size:12px;color:var(--muted);font-weight:600;padding:9px 10px;
    border-bottom:1px solid var(--line);white-space:nowrap;background:#fafbfd}
  td{padding:11px 10px;border-bottom:1px solid #eef2f7;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tbody tr.click{cursor:pointer}
  tbody tr.click:hover{background:#f7faff}
  .mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;direction:ltr;unicode-bidi:embed;
    white-space:nowrap}
  .money{direction:ltr;unicode-bidi:embed;font-weight:700;white-space:nowrap}
  .money small{font-weight:500;color:var(--muted);font-size:11px}
  .tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;
    border-radius:20px;white-space:nowrap}
  .tag.new{background:#dbe6f8;color:#1d3b7a}
  .tag.confirmed{background:#eef0ff;color:#4441a8}
  .tag.cut{background:#fff4e6;color:#96560a}
  .tag.sewing{background:var(--warn-l);color:var(--warn)}
  .tag.ready{background:#e9f4ff;color:#1c5fa8}
  .tag.delivered{background:var(--ok-l);color:var(--ok)}
  .tag.cancelled{background:var(--bad-l);color:var(--bad)}
  .tag.paid{background:var(--ok-l);color:var(--ok)}
  .tag.unpaid{background:var(--bad-l);color:var(--bad)}
  .tag.part{background:var(--warn-l);color:var(--warn)}
  .tag.late{background:var(--bad-l);color:var(--bad)}
  .tag.made{background:#dbe6f8;color:#1d3b7a}
  .tag.stock{background:#f1e9fb;color:#6b3fa0}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;font-size:12.5px;
    cursor:pointer;font-family:inherit;color:var(--muted);font-weight:600}
  .chip.on{background:var(--navy3);border-color:var(--navy3);color:#fff}
  .chip .n{opacity:.75;font-size:11px}
  .detail{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:13px;align-items:start}
  .detail>div{min-width:0}
  @media(max-width:1100px){.detail{grid-template-columns:minmax(0,1fr)}}
  .head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .head .code{font-size:20px;font-weight:800;direction:ltr}
  .head .who{font-size:13px;color:var(--muted)}
  .stepper{display:flex;padding:4px 0 10px;overflow:auto}
  .step{flex:1;min-width:84px;text-align:center;font-size:11.5px;color:var(--muted);position:relative;
    padding-top:26px;cursor:pointer}
  .step::before{content:"";position:absolute;top:8px;right:0;left:0;height:3px;background:#e6ecf4}
  .step:first-child::before{right:50%}
  .step:last-child::before{left:50%}
  .step .dot{position:absolute;top:1px;right:50%;transform:translateX(50%);width:15px;height:15px;
    border-radius:50%;background:#fff;border:3px solid #d5dfeb;z-index:2}
  .step.done .dot,.step.now .dot{background:var(--navy3);border-color:var(--navy3)}
  .step.done::before{background:var(--navy3)}
  .step.now{color:var(--navy3);font-weight:800}
  .step.done{color:#31527a}
  .measure{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .measure div{background:#f7f9fc;border:1px solid #eaf0f7;border-radius:10px;padding:9px;text-align:center}
  .measure .m-lab{font-size:11px;color:var(--muted)}
  .measure .m-val{font-size:16px;font-weight:800;direction:ltr}
  .line{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0}
  .line.tot{border-top:1px dashed var(--line);margin-top:6px;padding-top:10px;font-weight:800;font-size:15px}
  .line .k{color:var(--muted)}
  .profit{background:var(--ok-l);border-radius:10px;padding:10px 12px;margin-top:10px;display:flex;
    justify-content:space-between;align-items:center}
  .profit .v{font-weight:800;color:var(--ok);direction:ltr}
  .bar{height:9px;border-radius:20px;background:#eef2f7;overflow:hidden;margin-top:5px}
  .bar span{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--navy3),#3d84e0)}
  .kanban{display:grid;grid-template-columns:repeat(5,minmax(186px,1fr));gap:11px;overflow-x:auto;padding-bottom:6px}
  .col{background:#eff3f9;border-radius:var(--r);padding:10px;min-height:170px}
  .col h3{font-size:12.5px;margin-bottom:8px;display:flex;justify-content:space-between;color:#415874}
  .col h3 .n{background:#fff;border-radius:20px;padding:0 7px;font-size:11px;color:var(--muted)}
  .kcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:8px;
    font-size:12.5px;cursor:pointer}
  .kcard:hover{border-color:#bcd2ec}
  .kcard .t{font-weight:700;margin-bottom:3px}
  .kcard .meta{color:var(--muted);font-size:11.5px;display:flex;gap:7px;flex-wrap:wrap}
  .kcard.late{box-shadow:inset 3px 0 0 var(--bad)}
  .styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(206px,1fr));gap:13px}
  .style{padding:0;overflow:hidden}
  .style .ph{height:104px;background:linear-gradient(135deg,#e9f0fa,#d3e2f5);display:grid;place-items:center;
    font-size:26px;color:#8aa8cc;position:relative}
  .style .ph{overflow:hidden}
  .style .ph > img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain}
  .style .ph .tp{position:absolute;top:8px;inset-inline-start:8px}
  .style .bd{padding:11px}
  .style .nm{font-weight:700;font-size:13.5px}
  .style .cd{font-size:11.5px;color:var(--muted);direction:ltr;text-align:right}
  .style .pr{font-weight:800;font-size:15px;margin-top:5px;direction:ltr;text-align:right}
  .style .opts{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
  .style .opts span{font-size:10.5px;background:#f2f6fb;border:1px solid #e6eefa;border-radius:6px;
    padding:1px 6px;color:#48617f}
  .ovl{position:fixed;inset:0;background:#0b1a2dcc;display:none;place-items:center;padding:20px;z-index:99}
  .ovl.on{display:grid}
  .modal{background:#fff;border-radius:16px;width:min(560px,100%);max-height:88vh;overflow:auto;padding:20px}
  .modal h3{font-size:16px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .modal .hint{font-size:12px;color:var(--muted);margin-bottom:12px}
  .modal textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:12px;padding:12px;
    font-family:inherit;font-size:13.5px;line-height:1.9;resize:vertical;background:#fafcff}
  .modal input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:inherit;font-size:14px}
  .modal .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:flex-end}
  .wa-badge{background:#25d366;color:#fff;font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 6px}
  .toast{position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(50%) translateY(20px);
    background:#16202e;color:#fff;padding:11px 18px;border-radius:11px;font-size:13px;font-weight:600;
    opacity:0;pointer-events:none;transition:.25s;z-index:200}
  .toast.on{opacity:1;transform:translateX(50%) translateY(0)}
  .empty{text-align:center;padding:34px 12px;color:var(--muted);font-size:13.5px}
  .note{background:var(--warn-l);border:1px solid #efdfbe;border-radius:12px;padding:11px 14px;font-size:12.5px;
    color:#7a5c17;margin-bottom:14px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  @media(max-width:900px){.two{grid-template-columns:1fr}}
  .avatar{width:34px;height:34px;border-radius:50%;background:#dbe6f8;color:var(--navy3);display:grid;
    place-items:center;font-weight:800;font-size:13px;flex:0 0 34px}
  .custrow{display:flex;align-items:center;gap:10px}
  .login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(165deg,#22356f,#121E48);
    padding:20px}
  .loginbox{background:#fff;border-radius:18px;padding:26px;width:min(390px,100%);text-align:center}
  .loginbox .em{width:72px;height:72px;border-radius:50%;margin:0 auto 12px;box-shadow:0 0 0 3px #d8c39a99;
    background:#fff url('/brand/emblem_small.png') center/cover}
  .loginbox h1{font-size:20px;letter-spacing:2px;color:var(--navy)}
  .loginbox .sl{font-size:9.5px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:16px}
  .loginbox input{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;font-family:inherit;
    font-size:14px;margin-bottom:9px}
  .loginbox .btn{width:100%;justify-content:center}
  .fhint{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.8}
  .locked{background:#eef2f7;border:1px solid #dbe4ee;color:#5c6b80;border-radius:11px;padding:11px 12px;
    font-size:12px;font-weight:600;text-align:center;line-height:1.8}
  .locked b{color:#33405c}
  @media(max-width:820px){
    .app{flex-direction:column}
    aside{width:100%;flex:none;height:auto;position:static;padding:10px 11px;position:relative}
    .logo .em{width:32px;height:32px;flex:0 0 32px}
    .logo b{font-size:13px;letter-spacing:1.4px}
    .logo span{font-size:7.5px;letter-spacing:1.2px}
    .role{display:none}
    nav a{padding:8px 10px;font-size:12.5px}
    .btn{font-size:12.5px;padding:8px 11px}
    aside nav{display:flex;gap:5px;overflow:auto}
    nav a{white-space:nowrap}.navlabel,.sidenote{display:none}
    main{padding:15px 13px 50px}
    .stepper{display:grid;grid-template-columns:repeat(7,1fr)}
    .step{min-width:0;font-size:10px}
    .tscroll table{min-width:640px}
    .kpis{grid-template-columns:repeat(2,1fr)}.kpi .val{font-size:19px}
  }

  /* Inventory: aligned with the existing MAVI cards and restrained brand palette */
  .inv-kicker{font-size:11px;color:var(--gold);font-weight:700;margin-bottom:3px}
  .inv-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
  .inv-stat{display:flex;align-items:center;gap:11px;padding:15px;min-width:0}
  .inv-stat-icon,.inv-section-icon{display:grid;place-items:center;flex:0 0 auto;width:39px;height:39px;border-radius:11px;background:#edf2fa;color:var(--navy3);font-size:19px;font-weight:700}
  .inv-stat>div{min-width:0}.inv-stat span:not(.inv-stat-icon){display:block;font-size:12px;color:var(--muted)}
  .inv-stat b{display:block;color:var(--navy);font-size:21px;line-height:1.35}.inv-stat b small{font-size:11px;color:var(--muted);font-weight:600}
  .inv-stat-alert .inv-stat-icon{background:var(--warn-l);color:var(--warn)}
  .inv-info{display:flex;gap:10px;align-items:flex-start;border:1px solid #e8dfcf;background:#fbf8f2;border-radius:12px;padding:11px 14px;margin-bottom:16px;color:#67573f;font-size:12px;line-height:1.7}
  .inv-info-icon{display:grid;place-items:center;width:21px;height:21px;border-radius:50%;background:#f0e5d3;color:#886b3c;font-weight:800;flex:0 0 auto}
  .inv-section{padding:0;margin-bottom:14px;overflow:hidden}.inv-section-head{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;padding:17px 18px 12px}
  .inv-section-title{display:flex;align-items:center;gap:9px}.inv-section-icon{width:32px;height:32px;font-size:15px;border-radius:9px}.inv-section-title h2{font-size:15px}.inv-count{background:#f2f5f9;color:var(--muted);border-radius:20px;padding:2px 8px;font-size:11px;font-weight:600}.inv-section-head p{font-size:12px;color:var(--muted);margin-top:3px;margin-inline-start:41px}
  .inv-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:0 18px 13px}.inv-search{display:flex;gap:8px;align-items:center;max-width:360px;width:100%;background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:7px 10px;color:var(--muted)}.inv-search input{width:100%;border:0;outline:0;background:transparent;font:inherit;font-size:12.5px;color:var(--ink)}.inv-search:focus-within{border-color:#7d9bc4;box-shadow:0 0 0 3px #e9f0fa}.inv-tools-hint{font-size:11px;color:var(--muted)}
  .inv-table{min-width:610px}.inv-table th{padding:10px 18px}.inv-table td{padding:11px 18px}.inv-table small{color:var(--muted);font-size:11px}.inv-secondary{font-size:11px;color:var(--muted);margin-top:2px}.inv-size{display:inline-block;background:#f2f5fa;border-radius:6px;padding:2px 7px;font-size:12px;font-weight:700}.inv-empty,.inv-no-results{text-align:center;color:var(--muted);font-size:13px;padding:22px}.inv-no-results[hidden]{display:none}
  .inv-modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}.inv-modal-head h3{color:var(--navy);margin:0}.inv-modal-head p{font-size:12px;color:var(--muted);margin-top:4px}.inv-close{border:0;background:#f1f4f8;color:var(--muted);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:18px}#iv-new-group[hidden]{display:none}.inv-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.inv-field{font-size:12px;font-weight:700;color:#3b4d65}.inv-field input,.inv-field select{display:block;width:100%;padding:10px;margin-top:5px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:inherit;font-size:13.5px}.inv-field input:focus,.inv-field select:focus{outline:2px solid #d8e5f8;border-color:#7d9bc4}.inv-span{grid-column:1/-1}.inv-form-note{grid-column:1/-1;font-size:12px;color:var(--muted);background:#f7f9fc;border-radius:9px;padding:9px 11px}.inv-modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:17px;padding:14px 0 2px;border-top:1px solid var(--line);position:sticky;bottom:-20px;background:#fff;z-index:1}.inv-history{padding:11px 0;border-bottom:1px solid #eef2f7;display:flex;justify-content:space-between;gap:10px;font-size:13px}.inv-history small{color:var(--muted)}
  @media(max-width:900px){.inv-summary{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.inv-section-head{align-items:stretch}.inv-section-head .btn{justify-content:center;width:100%}.inv-tools-hint{display:none}.inv-form{grid-template-columns:1fr}.inv-span{grid-column:auto}.inv-stat{padding:12px}.inv-stat-icon{width:34px;height:34px}.inv-info{font-size:11.5px}}

<script>
/* ============================================================
   Everything here talks to /api/admin/*.
   Money lives under /api/admin/money/* which returns 403 for staff.
   ============================================================ */
// Isolated staging preview only: the production site has no language switch yet.
const STAGED_LANGUAGE = (() => {
  const requested = new URLSearchParams(location.search).get('preview_language');
  if (requested === 'ar' || requested === 'en') return requested;
  try { return localStorage.getItem('mavi_language') === 'en' ? 'en' : 'ar'; } catch (_) { return 'ar'; }
})();
function switchLanguage(){
  const prompt = STAGED_LANGUAGE === 'ar' ? 'تغيير اللغة سيعيد تحميل الصفحة وقد تفقدين أي بيانات غير محفوظة. هل تريدين المتابعة؟' : 'Changing language reloads the page and may discard unsaved changes. Continue?';
  if (!window.confirm(prompt)) return;
  const next = STAGED_LANGUAGE === 'ar' ? 'en' : 'ar';
  const url = new URL(location.href); url.searchParams.delete('preview_language');
  try { localStorage.setItem('mavi_language', next); } catch (_) { url.searchParams.set('preview_language', next); }
  location.assign(url.href);
}
document.documentElement.lang = STAGED_LANGUAGE;
document.documentElement.dir = STAGED_LANGUAGE === 'en' ? 'ltr' : 'rtl';
const tr = (key) => MaviI18n.translate(key, STAGED_LANGUAGE) || key;
const API = '/api/admin';
const TOKEN_KEY = 'mavi_admin_token';
let TOKEN = localStorage.getItem(TOKEN_KEY) || null;
let USER = null;
let VIEW = 'dash', FILTER = 'all', CURRENT = null;
let CACHE = { orders: [], counts: {}, styles: [], fabric: [], tailors: [], customers: [], stock: [] };

const EGP = n => new Intl.NumberFormat('en-EG',{maximumFractionDigits:2}).format(n);
const money = n => `<span class="money">${EGP(n)} <small>${tr('currency_egp')}</small></span>`;
const $ = id => document.getElementById(id);
const isOwner = () => USER && USER.role === 'owner';

let toastT;
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),2800); }

async function api(path, opts={}){
  const res = await fetch(API+path, {
    method: opts.method || 'GET',
    headers: {'Content-Type':'application/json', ...(TOKEN?{Authorization:'Bearer '+TOKEN}:{})},
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let data=null; try{ data = await res.json(); }catch(e){}
  if (res.status===401){ logoutLocal(); throw new Error('login'); }
  if (!res.ok) throw Object.assign(new Error(MaviI18n.serverMessage(data?.message, STAGED_LANGUAGE)||tr('ce_generic')), {status:res.status, data});
  return data;
}

const STATUS_AR = {
  new:{ar:'جديد',cls:'new'}, confirmed:{ar:'مؤكد',cls:'confirmed'}, cut:{ar:'قص القماش',cls:'cut'},
  sewing:{ar:'في التفصيل',cls:'sewing'}, ready:{ar:'جاهز',cls:'ready'},
  delivered:{ar:'تم التسليم',cls:'delivered'}, cancelled:{ar:'ملغي',cls:'cancelled'},
};
const PIPELINE = ['new','confirmed','cut','sewing','ready','delivered'];
function adminStatusLabel(status){const keys={new:'admin_status_new',confirmed:'admin_status_confirmed',cut:'admin_status_cut',sewing:'admin_status_sewing',ready:'admin_status_ready',delivered:'admin_status_delivered',cancelled:'admin_status_cancelled'};return keys[status]?tr(keys[status]):status;}
const statusTag = s => `<span class="tag ${STATUS_AR[s].cls}">${adminStatusLabel(s)}</span>`;
const fmtDate = d => d ? new Date(d).toLocaleDateString(STAGED_LANGUAGE==='en'?'en-EG':'ar-EG-u-nu-latn',{day:'2-digit',month:'short'}) : '—';
const daysLate = d => d ? Math.round((new Date(new Date().toDateString()) - new Date(d)) / 864e5) : 0;

/* ---------- login ---------- */
function loginScreen(){
  document.getElementById('root').innerHTML = `
  <div class="login"><div class="loginbox">
    <div class="em"></div>
    <h1>MAVI</h1><div class="sl">Tailor Your Design</div><button class="mavi-language" type="button" onclick="switchLanguage()" aria-label="Switch language / تغيير اللغة">EN / عربي</button>
    <input id="lemail" type="email" placeholder="${tr('email')}" autocomplete="username">
    <input id="lpass" type="password" placeholder="${tr('admin_password')}" autocomplete="current-password">
    <button class="btn primary" onclick="doLogin()">${tr('admin_signin')}</button>
    <div id="lerr" style="color:var(--bad);font-size:12.5px;margin-top:9px"></div>
    <div class="fhint">${tr('owner_hint')}<br>${tr('staff_hint')}</div>
  </div></div>`;
  $('lpass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}
async function doLogin(){
  const email = $('lemail').value.trim(), password = $('lpass').value;
  try{
    const r = await fetch(API+'/auth/login', {method:'POST',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email,password})});
    const d = await r.json();
    if (!r.ok) throw new Error(MaviI18n.serverMessage(d.message, STAGED_LANGUAGE) || tr('admin_login_failed'));
    TOKEN = d.token; USER = d.user; localStorage.setItem(TOKEN_KEY, TOKEN);
    boot();
  }catch(e){ $('lerr').textContent = e.message; }
}
function logoutLocal(){ TOKEN=null; USER=null; localStorage.removeItem(TOKEN_KEY); }
async function logout(){ try{ await api('/auth/logout',{method:'POST'}); }catch(e){} logoutLocal(); loginScreen(); }

/* ---------- nav ---------- */
function navItems(){
  const items = [
    {k:'dash', ic:'◈', label:tr('dashboard')},
    {k:'orders', ic:'▤', label:tr('admin_orders'), pill:()=> CACHE.counts.all || ''},
    {k:'board', ic:'▦', label:tr('tailoring_board')},
    {k:'styles', ic:'◇', label:tr('styles')},
    {k:'stock', ic:'▣', label:tr('materials')},
    {k:'cust', ic:'☺', label:tr('clients')},
  ];
  if (isOwner()) items.push({k:'reviews', ic:'★', label:tr('customer_reviews')}, {k:'money', ic:'₤', label:tr('finance')}, {k:'rep', ic:'▥', label:tr('reports')},
                            {k:'system', ic:'⛨', label:tr('backups_security')});
  return items;
}
function renderShell(content){
  document.getElementById('root').innerHTML = `
  <div class="app"><aside>
    <div class="logo"><div class="em"></div><div><b>MAVI</b><span>Tailor Your Design</span></div><button class="mavi-language" type="button" onclick="switchLanguage()" aria-label="Switch language / تغيير اللغة">EN / عربي</button></div>
    <div class="role">${isOwner()?tr('admin_owner_role'):tr('admin_staff_role')} · <b>${USER.name}</b></div>
    <div class="navlabel">${tr('daily_operations')}</div>
    <nav>${navItems().map(n=>{
      const p = typeof n.pill==='function' ? n.pill() : null;
      return `<a class="${VIEW===n.k?'on':''}" onclick="go('${n.k}')"><span class="ic">${n.ic}</span>${n.label}
        ${p?`<span class="pill">${p}</span>`:''}</a>`;
    }).join('')}<a href="/store/" target="_blank" rel="noopener noreferrer" class="admin-store-link"><span class="ic">↗</span>${tr('open_store')}</a></nav>
    ${isOwner()?'':`<div class="sidenote">${tr('admin_staff_note')}</div>`}
  </aside><main>${content}</main></div>`;
}
function go(v){ VIEW=v; render(); window.scrollTo({top:0}); }

/* ---------- render ---------- */
async function render(){
  try{
    if (VIEW==='dash')  return renderShell(await dashView());
    if (VIEW==='orders'){ await loadOrders(); const requests = isOwner() ? await customAdminView() : ''; if(VIEW!=='orders') return; return renderShell(ordersView(requests)); }
    if (VIEW==='order') return renderShell(await orderView());
    if (VIEW==='board'){ await loadOrders(); return renderShell(boardView()); }
    if (VIEW==='styles'){ await loadStyles(); return renderShell(stylesView()); }
    if (VIEW==='stock'){ await loadStock(); return renderShell(stockView()); }
    if (VIEW==='cust'){ await loadCustomers(); return renderShell(custView()); }
    if (VIEW==='reviews' && isOwner()) return renderShell(await adminReviewsView());
    if (VIEW==='money'){ return renderShell(await moneyView()); }
    if (VIEW==='rep'){ return renderShell(await repView()); }
    if (VIEW==='system'){ return renderShell(await systemView()); }
  }catch(e){
    if (e.status===403) return renderShell(`<div class="locked">${tr('ad_forbidden')}</div>`);
    return renderShell(`<div class="card">${tr('ad_render_error')} ${safeCustom(e.message)}</div>`);
  }
}

/* ---------- loaders ---------- */
async function loadOrders(){
  const q = FILTER==='all' ? '' : '?status='+FILTER;
  const r = await api('/orders'+q); CACHE.orders = r.orders; CACHE.counts = r.counts;
}
async function loadStyles(){ CACHE.styles = (await api('/styles')).styles; }
async function loadStock(){
  const [f,t,s,styles] = await Promise.all([api('/fabric'), api('/tailors'), api('/stock'),api('/styles')]);
  CACHE.fabric=f.fabric; CACHE.tailors=t.tailors; CACHE.stock=s.stock; CACHE.styles=styles.styles;
}
async function loadCustomers(){ CACHE.customers = (await api('/customers')).customers; }

/* ---------- dashboard ---------- */
async function dashView(){
  const d = await api('/dashboard');
  const rows = (await api('/orders')).orders.slice(0,6);
  const open = d.open_orders;
  return `
  <div class="topbar">
    <div><h1>${tr('dashboard')}</h1><div class="sub">${d.today} · ${isOwner()?tr('owner_overview'):tr('staff_overview')}</div></div>
    <div class="spacer"></div>
    <a class="btn" href="/store/" target="_blank">${tr('customer_storefront')}</a>
  </div>
  <div class="grid kpis">
    ${isOwner()?`
      <div class="card kpi accent"><div class="lab">${tr('recorded_revenue')}</div>
        <div class="val">${EGP(d.money.revenue)} <small>${tr('currency_egp')}</small></div><div class="foot">${d.counts.all} ${tr('order_count')}</div></div>
      <div class="card kpi"><div class="lab">${tr('gross_profit')}</div>
        <div class="val" style="color:var(--ok)">${EGP(d.money.gross_profit)}</div>
        <div class="foot">${tr('after_materials')}</div></div>
      <div class="card kpi gold"><div class="lab">${tr('customer_outstanding')}</div>
        <div class="val">${EGP(d.money.outstanding)}</div><div class="foot">${tr('follow_up_needed')}</div></div>`
    :`
      <div class="card kpi accent"><div class="lab">${tr('open_orders')}</div>
        <div class="val">${open}</div><div class="foot">${d.counts.all} ${tr('all_orders')}</div></div>`}
    <div class="card kpi"><div class="lab">${tr('ready_delivery')}</div><div class="val">${d.ready}</div>
      <div class="foot">${tr('contact_customer')}</div></div>
    <div class="card kpi" style="border-color:#f0c9c9;background:#fffafa">
      <div class="lab" style="color:var(--bad)">${tr('late')}</div>
      <div class="val" style="color:var(--bad)">${d.late_orders}</div>
      <div class="foot">${d.late_orders?tr('needs_follow_up'):tr('no_delays')}</div></div>
    <div class="card kpi"><div class="lab">${tr('low_materials')}</div><div class="val">${d.low_fabric}</div>
      <div class="foot">${tr('below_reorder')}</div></div>
  </div>

  <h2 class="sec">${tr('recent_orders')}</h2>
  <div class="card" style="padding:0;overflow:hidden"><div class="tscroll"><table>
    <thead><tr><th>${tr('order_code')}</th><th>${tr('customer')}</th><th>${tr('items')}</th><th>${tr('channel')}</th><th>${tr('due_date')}</th><th>${tr('status')}</th>${isOwner()?`<th>${tr('total')}</th>`:''}<th></th></tr></thead>
    <tbody>${rows.map(o=>`<tr class="click" onclick="openOrder('${o.code}')">
      <td class="mono">${o.code}</td>
      <td>${o.customer?.name||''}</td>
      <td style="font-size:12.5px;color:#42586f">${o.items.map(i=>i.style_name).join(' + ')}</td>
      <td style="font-size:12px;color:var(--muted)">${o.channel}</td>
      <td style="font-size:12.5px">${fmtDate(o.promise_date)} ${o.late?`<span class="tag late">${tr('late')}</span>`:''}</td>
      <td>${statusTag(o.status)}</td>
      ${isOwner()?`<td class="money">${EGP(o.totals.total)}</td>`:''}
      <td style="text-align:left"><button class="btn ghost sm">${tr('open')} ›</button></td></tr>`).join('')}</tbody>
  </table></div></div>`;
}

/* ---------- orders list ---------- */
function ordersView(requests=''){
  const chips = [{k:'all',label:tr('admin_all'),n:CACHE.counts.all||0}].concat(
    Object.entries(STATUS_AR).map(([k,v])=>({k,label:adminStatusLabel(k),n:CACHE.counts[k]||0})));
  return `

async function setStatus(code, status){
  try{
    const r = await api(`/orders/${code}/status`, {method:'PATCH', body:{status}});
    toast(tr('admin_status_prefix') + adminStatusLabel(status));
    await render();
    if (r.message) showMessage(r.message.text, r.order?.customer?.phone);
  }catch(e){ toast(e.message); }
}
async function saveProduction(itemId){
  const body = {
    fabric_id: $('fab_'+itemId)?.value || null,
    metres_used: $('met_'+itemId)?.value || 0,
    tailor_id: $('tal_'+itemId)?.value || null,
  };
  try{ await api(`/order-items/${itemId}/production`, {method:'PATCH', body});
    toast(tr('am_cost_calculated')); await render();
  }catch(e){ toast(e.message); }
}
async function addPayment(code, amount){
  try{
    await api(`/orders/${code}/payments`, {method:'POST', body:{amount, method:'cash'}});
    toast(tr('am_payment_recorded')); await render();
  }catch(e){ toast(e.message); }
}

async function showOrderMessage(code){try{const r=await api('/orders/'+code);showMessage(r.message?.text,r.order?.customer?.phone)}catch(e){toast(e.message)}}
let messagePhone='';
function showMessage(text,phone){
  messagePhone=String(phone||'').replace(/[^0-9]/g,'');
  $('modal').innerHTML = `
    <h3><span class="wa-badge">WA</span> ${tr('am_message_title')}</h3>
    <div class="hint">${tr('am_message_warning')}</div>
    <textarea id="msgta" dir="rtl">${safeCustom(text||'')}</textarea>
    <div class="row"><button class="btn" onclick="closeModal()">${tr('close')}</button><button class="btn" onclick="copyMsg()">${tr('am_copy')}</button>${/^01[0-9]{9}$/.test(messagePhone)?`<button class="btn wa" onclick="sendStatusWhatsapp()">${tr('am_open_whatsapp')}</button>`:''}</div>`;
  $('ovl').classList.add('on');
}
function sendStatusWhatsapp(){if(!/^01[0-9]{9}$/.test(messagePhone)){toast(tr('am_invalid_phone'));return}window.open('https://wa.me/2'+messagePhone+'?text='+encodeURIComponent($('msgta').value),'_blank','noopener');}

function closeModal(){ $('ovl').classList.remove('on'); if(typeof clearStylePhotoUrls==='function')clearStylePhotoUrls(); }
function copyMsg(){ const ta=$('msgta'); ta.select();
  try{ document.execCommand('copy'); }catch(e){} toast(tr('am_copied')); }

function openCustomerReset(id){
  const customer=CACHE.customers.find(c=>c.id===id); if(!customer)return;
  $('modal').innerHTML=`<h3>${tr('cu_reset_title')}</h3><p class="hint">${tr('cu_reset_warning')}</p><label>${tr('cu_reset_password')}<input id="customer-new-password" type="password" minlength="10" maxlength="128" autocomplete="new-password"></label><div class="row"><button class="btn" onclick="$('ovl').classList.remove('on')">${tr('cancel')}</button><button class="btn primary" onclick="saveCustomerReset(${id})">${tr('save')}</button></div><div id="customer-reset-error" style="color:var(--bad)"></div>`;
  $('ovl').classList.add('on');
}
async function saveCustomerReset(id){try{const password=$('customer-new-password').value;await api('/customers/'+id+'/reset-password',{method:'POST',body:{password}});$('customer-new-password').value='';$('ovl').classList.remove('on');toast(tr('cu_reset_done'));}catch(e){$('customer-reset-error').textContent=e.message}}

async function downloadBackup(){
  try{
    const res = await fetch(API+'/system/backup', {headers:{Authorization:'Bearer '+TOKEN}});
    if (!res.ok) throw new Error(tr('sys_backup_failed'));
    const blob = await res.blob();
    const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `mavi-backup-${stamp}.db`;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast(tr('sys_backup_saved'));
    setTimeout(render, 900);
  }catch(e){ toast(e.message); }
}

async function savePublicUrl(){
  try{
    const r = await api('/system/public-url', {method:'POST', body:{url: $('puburl').value.trim()}});
    toast(tr('sys_url_saved')); render();
  }catch(e){ toast(e.message); }
}

async function changePassword(){
  try{
    await api('/system/change-password', {method:'POST',
      body:{current: $('pw_cur').value, next: $('pw_new').value}});
    toast(tr('sys_password_saved')); render();
  }catch(e){ toast(e.message); }
}

/* ---------- boot ---------- */
async function boot(){
  // even with no token in localStorage, the httpOnly cookie may still be valid
  // (this is what keeps the phone signed in between app opens)
  try{ USER = (await api('/me')).user; }
  catch(e){ loginScreen(); return; }
  try{ const d = await api('/orders'); CACHE.orders=d.orders; CACHE.counts=d.counts; }catch(e){}
  render();
}
$('ovl').addEventListener('click', e=>{ if(e.target.id==='ovl') closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
boot();
